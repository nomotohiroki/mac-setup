# ~/.config/starship.toml

# 2行プロンプト構成で、1行目にディレクトリやGitステータス、2行目に入力文字を配置
format = """
$os\
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$rust\
$docker_context\
$line_break\
$character"""

add_newline = true
command_timeout = 2000

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
Macos = " "

[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[package]
disabled = true

[git_branch]
symbol = " "
style = "bold magenta"
format = "on [$symbol$branch]($style) "
truncation_length = 8
truncation_symbol = ""
ignore_branches = []

[git_status]
style = "bold yellow"
format = "[[($all_status$ahead_behind)]($style)] "
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version)]($style) "
